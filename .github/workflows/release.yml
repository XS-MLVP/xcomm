name: Release Python distributions

on:
  repository_dispatch:
    types: [version-tagged]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to publish (vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: xspcomm-release
  queue: max
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.client_payload.tag || inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate existing tag
        id: version
        env:
          TAG: ${{ github.event.client_payload.tag || inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/${TAG}^{commit}")"
          git fetch origin master:refs/remotes/origin/master --tags
          python scripts/release/tag_policy.py verify HEAD
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  distributions:
    needs: validate
    uses: ./.github/workflows/build-python.yml
    with:
      ref: ${{ needs.validate.outputs.tag }}
      artifact-prefix: xspcomm-release

  github-release:
    needs: [validate, distributions]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: xspcomm-release-*
          merge-multiple: true
          path: dist
      - run: python -m pip install 'packaging>=24' 'twine>=6,<7'
      - name: Check complete release matrix
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          python scripts/release/check_distributions.py dist "$VERSION"
          python -m twine check --strict dist/*
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          files: |
            dist/*.whl
            dist/*.tar.gz
          fail_on_unmatched_files: true
          overwrite_files: false

  pypi:
    needs: github-release
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/uc-xcomm
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: xspcomm-release-*
          merge-multiple: true
          path: dist
      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
