name: Python wheel

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distributions:
    uses: ./.github/workflows/build-python.yml

  source-install:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
        swig: ["4.2.1", "4.5.1"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install system build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build
      - run: python -m unittest discover -s tests/release -v
      - run: python -m pip install 'build>=1,<2'
      - run: python -m build --sdist
      - name: Install sdist with default native optimization
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "4"
        run: |
          python -m venv /tmp/xspcomm-source-test
          /tmp/xspcomm-source-test/bin/python -m pip install --upgrade 'pip>=25.3'
          echo 'swig==${{ matrix.swig }}' > /tmp/xspcomm-build-constraints.txt
          /tmp/xspcomm-source-test/bin/python -m pip install --no-cache-dir dist/*.tar.gz \
            --build-constraint /tmp/xspcomm-build-constraints.txt \
            -Ccmake.define.BUILD_TESTING=ON \
            -Ccmake.define.CMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -Cbuild-dir=/tmp/xspcomm-source-build
          ctest --test-dir /tmp/xspcomm-source-build --output-on-failure
          python scripts/release/check_build.py /tmp/xspcomm-source-build
          /tmp/xspcomm-source-test/bin/python -m pip check
          /tmp/xspcomm-source-test/bin/python scripts/release/check_wheel.py
