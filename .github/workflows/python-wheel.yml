name: Python wheel

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  wheel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build swig
      - name: Check release tag policy
        run: python -m unittest discover -s tests/release -v
      - name: Build wheel
        run: |
          python -m pip install 'build>=1,<2'
          export CMAKE_BUILD_PARALLEL_LEVEL="$(nproc)"
          python -m build --wheel
      - name: Rebuild wheel from sdist
        run: |
          set -euo pipefail
          python -m build --sdist
          mkdir -p /tmp/xspcomm-sdist-source /tmp/xspcomm-sdist-wheel
          tar -xf dist/xspcomm-*.tar.gz -C /tmp/xspcomm-sdist-source
          source_dir=(/tmp/xspcomm-sdist-source/xspcomm-*)
          cd "${source_dir[0]}"
          export CMAKE_BUILD_PARALLEL_LEVEL="$(nproc)"
          python -m build --wheel --outdir /tmp/xspcomm-sdist-wheel
          python - <<'PY'
          import os
          from pathlib import Path
          built = {p.name for p in Path('/tmp/xspcomm-sdist-wheel').glob('*.whl')}
          original = {p.name for p in (Path(os.environ['GITHUB_WORKSPACE']) / 'dist').glob('*.whl')}
          assert built == original, (built, original)
          PY
      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/xspcomm-wheel-test
          /tmp/xspcomm-wheel-test/bin/python -m pip install --no-index --find-links=dist xspcomm
          /tmp/xspcomm-wheel-test/bin/python -m pip check
          /tmp/xspcomm-wheel-test/bin/python - <<'PY'
          from importlib.metadata import version
          from pathlib import Path
          import xspcomm

          assert xspcomm.version() == version("xspcomm")
          signal = xspcomm.XData(8, xspcomm.XData.InOut)
          signal.Set(0xA5)
          assert signal.U() == 0xA5
          clock = xspcomm.XClock(lambda _: 0)
          clock.Step(2)
          assert clock.clk == 2
          assert xspcomm.abi_version() > 0
          assert (Path(xspcomm.__file__).parent / f"libxspcomm.so.{xspcomm.abi_version()}").exists()
          from subprocess import check_output
          binary = Path(xspcomm.__file__).parent / "_pyxspcomm.so"
          dynamic = check_output(["readelf", "-d", str(binary)], text=True)
          assert f"libxspcomm.so.{xspcomm.abi_version()}" in dynamic
          assert "Library runpath: [$ORIGIN/]" in dynamic
          assert "/home/" not in dynamic and "/usr/local/lib" not in dynamic
          print("installed xspcomm", version("xspcomm"), xspcomm.__file__)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: xspcomm-dev-wheel-${{ runner.arch }}-${{ github.sha }}
          path: dist/*.whl
