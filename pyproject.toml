[build-system]
requires = ["scikit-build-core>=1.0,<2", "setuptools-scm>=8,<10", "swig==4.5.1"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
cmake.build-type = "Release"
sdist.include = ["scripts/release/**"]

[tool.scikit-build.cmake.define]
BUILD_TESTING = "OFF"

[project]
name = "xspcomm"
dynamic = ["version"]
description = "Native signal, clock, trigger and coverage runtime for hardware verification"
readme = "README.en.md"
requires-python = ">=3.11"
license = "MulanPSL-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "Operating System :: POSIX :: Linux",
]

[project.urls]
Homepage = "https://github.com/XS-MLVP/xcomm"
Source = "https://github.com/XS-MLVP/xcomm"
Issues = "https://github.com/XS-MLVP/xcomm/issues"

[tool.cibuildwheel]
build = ["cp311-manylinux_x86_64", "cp312-manylinux_x86_64"]
build-frontend = "build"
environment = { CMAKE_BUILD_PARALLEL_LEVEL = "4", CMAKE_GENERATOR = "Unix Makefiles", CXXFLAGS = "-D_GLIBCXX_USE_CXX11_ABI=1" }
test-command = "python {project}/scripts/release/check_wheel.py --cxx11-abi=1"
before-test = "python {project}/scripts/release/check_build.py {project}/build --portable"

[tool.cibuildwheel.config-settings]
"cmake.define.XSPCOMM_NATIVE" = "OFF"
"cmake.define.CMAKE_EXPORT_COMPILE_COMMANDS" = "ON"
"build-dir" = "build/{wheel_tag}"

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]
fallback_version = "0.1.0.dev0"
tag_regex = '^v(?P<version>\d+\.\d+\.\d+)$'
git_describe_command = 'git describe --dirty --tags --long --match "v[0-9]*"'
local_scheme = "no-local-version"
